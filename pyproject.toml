[project]
name = "lelamp-runtime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feetech-servo-sdk>=1.0.0",
    "lerobot>=0.3.3",
    "livekit-agents==1.3.8",
    # LiveKit Realtime AI Providers
    "livekit-plugins-openai==1.3.8",      # OpenAI Realtime API
    "livekit-plugins-xai==1.3.8",         # xAI Grok Voice Agent
    "livekit-plugins-google==1.3.8",      # Google Gemini Live
    "livekit-plugins-azure==1.3.8",       # Azure OpenAI Realtime
    # "livekit-plugins-aws==1.3.8",       # AWS Nova Sonic (Python only, may need extra deps)
    # "livekit-plugins-ultravox==1.3.8",  # Ultravox Realtime (Python only)
    # LiveKit Utilities
    "livekit-plugins-noise-cancellation~=0.2",
    "livekit-plugins-silero~=1.3",
    "numpy>=2.2.6",
    "pyarrow==20.0.0",
    "pyaudio>=0.2.14",
    "python-dotenv",
    "pyyaml>=6.0.0",
    "sounddevice>=0.5.2",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "pytz>=2024.1",
    "feedparser>=6.0.0",
    "openai-whisper>=20231117",
    "spotipy>=2.23.0",
    "netifaces>=0.11.0",
    "timezonefinder>=6.5.0",
    # Authentication
    "PyJWT>=2.8.0",
    "httpx>=0.27.0",
    # Local voice pipeline dependencies
    "faster-whisper>=1.0.0",
    "soxr>=0.3.0",
    # opencv-python-headless at end + override-dependencies ensures headless is used
    "opencv-python-headless>=4.11.0.86",
    "torchaudio>=2.7.1",
    "rpi-ws281x>=5.0.0",
    "lgpio>=0.2.2.0",
    "adafruit-circuitpython-neopixel>=6.3.18",
    "adafruit-blinka>=8.68.1",
    "cryptography==44.0.0",
]

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot" }

[tool.uv]
# Force headless opencv - prevents lerobot from pulling in the GUI version
override-dependencies = [
    "opencv-python>=4.11.0.86 ; sys_platform == 'never'",
]

[project.optional-dependencies]
hardware = [
    "rpi-ws281x",
]
